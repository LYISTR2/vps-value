name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh lockfile candidate (temporary diagnostic)
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          node -e "const b=require('fs').readFileSync('package-lock.json').toString('base64');for(let i=0;i<b.length;i+=4000)console.log('LOCKFILE_CHUNK '+(i/4000)+' '+b.slice(i,i+4000))"
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Deployment regression tests (isolated fixtures)
        run: sudo "$(command -v node)" --test tests/deploy.test.js
      - run: bash -n deploy.sh
      - run: docker compose config -q
      - run: docker build -t vps-value:test .
      - name: Container smoke
        run: |
          docker run -d --name vps-value-test -p 18088:8080 vps-value:test
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18088/api/health && exit 0
            sleep 1
          done
          docker logs vps-value-test
          exit 1
