name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: docker compose config -q
      - run: docker build -t vps-value:test .
      - name: Container smoke
        run: |
          docker run -d --name vps-value-test -p 18088:8080 vps-value:test
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18088/api/health && exit 0
            sleep 1
          done
          docker logs vps-value-test
          exit 1